<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Nova aba</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-content: center;
      gap: 12px;
      background: #0b0b0d;
      color: #ece9e2;
      font: 16px/1.4 "Segoe UI", system-ui, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 56px;
      letter-spacing: 0.04em;
      color: #ffb429;
      text-shadow: 0 0 28px rgba(255, 180, 41, 0.35);
    }
    p { margin: 0; color: #8a8780; }
    kbd {
      padding: 2px 6px;
      border: 1px solid #26262b;
      border-radius: 4px;
      background: #141417;
      font: 13px "Cascadia Mono", Consolas, monospace;
    }
  </style>
</head>
<body>
  <h1>EVL</h1>
  <p><kbd>Ctrl</kbd> + <kbd>L</kbd> foca a barra de endereço</p>
</body>
</html>
